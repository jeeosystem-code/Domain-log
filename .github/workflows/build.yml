name: Build APK from ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1)
          [ -n "$ZIP" ] || { echo "No .zip found in repo root"; exit 1; }
          mkdir -p /tmp/proj
          unzip -q "$ZIP" -d /tmp/proj
          SETTINGS=$(find /tmp/proj -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)
          [ -n "$SETTINGS" ] || { echo "No settings.gradle found in zip"; exit 1; }
          echo "PROJ_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV
      - name: Build debug APK
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.PROJ_DIR }}/**/build/outputs/apk/debug/*.apk
